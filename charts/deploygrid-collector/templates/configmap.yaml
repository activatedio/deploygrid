{{- if .Values.sources.applicationKinds }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "deploygrid-collector.fullname" . }}
  labels:
    {{- include "deploygrid-collector.labels" . | nindent 4 }}
data:
  config.yaml: |-
    sources:
      applicationKinds:
        {{- toYaml .Values.sources.applicationKinds | nindent 8 }}
{{- end }}
