server:
  url: https://deploygrid.example.com/api
cluster:
  name: prod-east
token: example-token
image:
  tag: v0.1.0
sources:
  applicationKinds:
    - group: platform.example.com
      version: v1alpha1
      resource: appsuites
      kind: AppSuite
      component: appsuite
      runningVersionPath: "{.status.components[*].image}"
      pinnedVersionsPath: "{.spec.services.*.image.tag}"
