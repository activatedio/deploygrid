{{- if .Values.rbac.create }}
---
kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "deploygrid.fullname" . }}-clusterrole
rules:
  # Observation of workloads and delivery resources (read only).
  - apiGroups: ['', 'apps', 'networking.k8s.io', 'argoproj.io']
    resources: ['namespaces', 'deployments', 'statefulsets', 'daemonsets', 'ingresses', 'applications', 'secrets']
    verbs: ['get', 'watch', 'list']
  # deploygrid custom resources, including status updates.
  - apiGroups: ['deploygrid.activated.io']
    resources: ['*']
    verbs: ['get', 'watch', 'list', 'create', 'update', 'patch', 'delete']
{{- if .Values.serviceAccount.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "deploygrid.fullname" . }}-clusterrolebinding
subjects:
- kind: ServiceAccount
  name: {{ include "deploygrid.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "deploygrid.fullname" . }}-clusterrole
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
