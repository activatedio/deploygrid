{{- if .Values.api.service.dedicated }}
# A Service exposing only the API container, for routes that must reach the
# API without going through the UI's nginx (collector ingest), or that need
# their own health-check policy. Gateway health-check policies attach to a
# whole Service, which is why this is separate from the main one.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "deploygrid.fullname" . }}-api
  labels:
    {{- include "deploygrid.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type | default .Values.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
      protocol: TCP
      name: http-api
  selector:
    {{- include "deploygrid.selectorLabels" . | nindent 4 }}
{{- end }}
