replicaCount: 1

service:
  type: ClusterIP

api:
  image:
    repository: ghcr.io/activatedio/deploygrid-api
    pullPolicy: IfNotPresent
    tag: "v0.0.0"
  service:
    port: 8080
    # dedicated: true also creates Service <release>-api exposing only the
    # API container, for an ingest route that bypasses the UI's nginx and
    # needs its own health-check policy (checks /api/healthz on 8080).
    dedicated: false
    type: ""

ui:
  image:
    repository: ghcr.io/activatedio/deploygrid-ui
    pullPolicy: IfNotPresent
    tag: "v0.0.0"
  service:
    port: 80

#
# Clusters the server watches itself. Clusters fed by a collector need no
# entry here: create a Cluster resource with collection.mode: agent and
# install the deploygrid-collector chart in that cluster with the generated
# token.
#
# clusters:
#   - name: cluster1
#     kubeconfigSecretName: cluster1-secret
#     address: https://localhost:8080
#   - name: local
#     mode: local
#   # GKE cluster in another project, reached from here with this pod's
#   # Google identity (workload identity on the service account) against the
#   # cluster's DNS-based control-plane endpoint, as Argo CD does:
#   - name: rs-dev01
#     mode: kubeconfig
#     auth: google
#     address: https://gke-xxxx.us-central1.gke.goog
clusters: []
environments: []

# Operator-installed applications to observe (server-side watches in modes
# kubeconfig/local). Each entry is a custom resource kind; workloads owning
# a controller ownerReference to an instance are grouped under it.
#
# sources:
#   applicationKinds:
#     - group: platform.ritesuite.com
#       version: v1alpha1
#       resource: ritesuites
#       kind: RiteSuite
#       component: ritesuite
#       runningVersionPath: "{.status.components[*].image}"
sources:
  applicationKinds: []

# Custom resource definitions for System, Component, Cluster, Configuration
# and ConfigurationView.
crds:
  enabled: true
  # Keep CRDs (and the data they hold) when the release is uninstalled.
  keep: true

# The control cluster is the cluster this chart is installed into; deploygrid
# custom resources are read from the release namespace.
control:
  enabled: true

# This is for the secretes for pulling an image from a private repository more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
imagePullSecrets: []
# This is to override the chart name.
nameOverride: ""
fullnameOverride: ""

rbac:
  create: true

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/ 
podAnnotations: {}
# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# Both images run as an unprivileged user (distroless nonroot for the API,
# nginx-unprivileged for the UI).
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: ["ALL"]


ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  host: chart-example.local
  # Use "/*" with ImplementationSpecific for ALB/GCE style controllers.
  path: /
  pathType: Prefix

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

nodeSelector: {}

tolerations: []

affinity: {}
