# permissions for end users to edit metadata.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: tmp
    app.kubernetes.io/managed-by: kustomize
  name: metadata-editor-role
rules:
- apiGroups:
  - deploygrid.activated.io.activated.io
  resources:
  - metadata
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - deploygrid.activated.io.activated.io
  resources:
  - metadata/status
  verbs:
  - get
