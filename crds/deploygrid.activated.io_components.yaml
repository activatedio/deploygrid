---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.4
  name: components.deploygrid.activated.io
spec:
  group: deploygrid.activated.io
  names:
    kind: Component
    listKind: ComponentList
    plural: components
    shortNames:
    - comp
    singular: component
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.system
      name: System
      type: string
    - jsonPath: .spec.group
      name: Group
      type: string
    - jsonPath: .spec.kind
      name: Kind
      type: string
    - jsonPath: .status.discovered
      name: Discovered
      type: boolean
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Component is one row of a System's grid: a deployable unit whose identity
          is stable across environments. Its status carries the current version in
          each environment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ComponentSpec defines the desired state of Component.
            properties:
              description:
                type: string
              displayName:
                type: string
              group:
                description: |-
                  Group places the component under a System group. Unknown groups are
                  created on the fly in alphabetical order after declared groups.
                type: string
              kind:
                default: custom
                description: Kind classifies the version shown in the cell.
                enum:
                - helm-chart
                - container
                - argocd-application
                - operator-application
                - service
                - custom
                type: string
              links:
                items:
                  description: |-
                    ComponentLink is a templated URL rendered per environment. The template
                    context exposes .System, .Component, .Environment, .Cluster, .Namespace,
                    .Version and .Hosts.
                  properties:
                    name:
                      minLength: 1
                      type: string
                    urlTemplate:
                      minLength: 1
                      type: string
                  required:
                  - name
                  - urlTemplate
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              order:
                description: |-
                  Order is a sort hint within the group; lower sorts first, ties sort by
                  name.
                format: int32
                type: integer
              parent:
                description: |-
                  Parent is the name of another Component in the same System under which
                  this one is nested in the grid.
                type: string
              selector:
                description: |-
                  ComponentSelector describes how observed resources are matched to this
                  Component. All specified criteria must match. When empty, the component is
                  matched by the deploygrid.activated.io/component label or annotation whose
                  value equals the Component name.
                properties:
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: MatchLabels must all be present on the observed resource.
                    type: object
                  names:
                    description: Names restricts matches to resources with one of
                      these names.
                    items:
                      type: string
                    type: array
                  namespaces:
                    description: Namespaces restricts matches to these namespaces
                      (in any cluster).
                    items:
                      type: string
                    type: array
                type: object
              system:
                description: |-
                  System is the name of the System (same namespace) this Component
                  belongs to.
                minLength: 1
                type: string
            required:
            - system
            type: object
          status:
            description: ComponentStatus defines the observed state of Component.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              discovered:
                description: |-
                  Discovered is true when this Component was created automatically from
                  observed resources rather than declared by a user.
                type: boolean
              environments:
                description: |-
                  Environments holds the current cell for each environment in which the
                  component has been observed.
                items:
                  description: ComponentEnvironmentStatus is the current cell for
                    one environment.
                  properties:
                    cluster:
                      type: string
                    desiredVersion:
                      description: |-
                        DesiredVersion is the version declared by the delivery source (for
                        example an Argo CD Application targetRevision), when known.
                      type: string
                    environment:
                      type: string
                    health:
                      description: 'Health is a coarse rollup: Healthy, Progressing,
                        Degraded or Unknown.'
                      type: string
                    hosts:
                      description: Hosts are ingress hostnames serving this component.
                      items:
                        type: string
                      type: array
                    lastChangeTime:
                      description: LastChangeTime is when Version last changed.
                      format: date-time
                      type: string
                    lastObservedTime:
                      description: LastObservedTime is when this cell was last reported.
                      format: date-time
                      type: string
                    namespace:
                      type: string
                    version:
                      description: Version is the running (actual) version.
                      type: string
                  required:
                  - environment
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - environment
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
