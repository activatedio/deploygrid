## CRD for the simulated operator-installed application; applied and
## established before kind/operator.yaml.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: appsuites.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: AppSuite
    listKind: AppSuiteList
    plural: appsuites
    singular: appsuite
    shortNames: [asuite]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # no status subresource so the fixture status applies with the object
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
