## CRD for the simulated operator-installed application; applied and
## established before kind/operator.yaml.
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ritesuites.platform.ritesuite.com
spec:
  group: platform.ritesuite.com
  names:
    kind: RiteSuite
    listKind: RiteSuiteList
    plural: ritesuites
    singular: ritesuite
    shortNames: [rsuite]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      # no status subresource so the fixture status applies with the object
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
