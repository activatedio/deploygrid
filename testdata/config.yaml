---
logging:
  devMode: true
control:
  enabled: true
  namespace: deploygrid
  kubeConfigPath: .kind/kubeconfig-ops-cluster-1.yaml
clusters:
  environments:
    - Dev
    - QA
    - Stage
  clusters:
    - name: kind-ops-cluster-1
      address: https://127.0.0.1:6443
      kubeConfigPath: .kind/kubeconfig-ops-cluster-1.yaml
    - name: kind-app-cluster-1
      address: https://127.0.0.1:6444
      kubeConfigPath: .kind/kubeconfig-app-cluster-1.yaml
    - name: kind-app-cluster-2
      address: https://127.0.0.1:6445
      kubeConfigPath: .kind/kubeconfig-app-cluster-2.yaml

sources:
  # operator-installed applications: one row per kind, instances mapped to
  # environments through the Cluster namespace rules
  applicationKinds:
    - group: platform.ritesuite.com
      version: v1alpha1
      resource: ritesuites
      kind: RiteSuite
      component: ritesuite
      runningVersionPath: "{.status.components[*].image}"
      pinnedVersionsPath: "{.spec.services.*.image.tag}"
